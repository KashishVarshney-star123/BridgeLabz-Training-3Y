<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live Character Counter</title>
  <link rel="stylesheet" href="character-counter.css">
</head>
<body>

  <main class="container">
    <h1>Live Character Counter</h1>

    <textarea id="textInput" rows="6" placeholder="Start typing here..."></textarea>

    <div class="info-row">
      <p id="counter" class="counter">100 characters remaining</p>
      <button type="button" id="resetButton">Reset</button>
    </div>

    <p id="warning" class="warning"></p>
  </main>

  <script src="character-counter.js"></script>
</body>
</html>
