<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Client Server Diagram</title>
</head>
<body>

  <h2>Client-Server Model Diagram</h2>

  <svg viewBox="0 0 500 200" xmlns="http://www.w3.org/2000/svg">

    <!-- Client box -->
    <rect x="30" y="60" width="120" height="60" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="90" y="95" text-anchor="middle" font-size="14">CLIENT</text>

    <!-- Server box -->
    <rect x="350" y="60" width="120" height="60" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="410" y="95" text-anchor="middle" font-size="14">SERVER</text>

    <!-- Request arrow (Client to Server) -->
    <line x1="150" y1="75" x2="350" y2="75" stroke="green" stroke-width="2"/>
    <text x="250" y="65" text-anchor="middle" font-size="11">Request</text>

    <!-- Response arrow (Server to Client) -->
    <line x1="350" y1="105" x2="150" y2="105" stroke="orange" stroke-width="2"/>
    <text x="250" y="125" text-anchor="middle" font-size="11">Response</text>

  </svg>

</body>
</html>
