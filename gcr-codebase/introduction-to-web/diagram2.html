<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web Architecture Flow Diagram</title>
</head>
<body>

  <h2>Web Architecture Flow Diagram</h2>

  <svg viewBox="0 0 700 200" xmlns="http://www.w3.org/2000/svg">

    <!-- Client box -->
    <rect x="10" y="70" width="130" height="60" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="75" y="105" text-anchor="middle" font-size="14">CLIENT</text>

    <!-- API box -->
    <rect x="200" y="70" width="130" height="60" fill="#d4edda" stroke="#333" stroke-width="2"/>
    <text x="265" y="100" text-anchor="middle" font-size="14">API</text>
    <text x="265" y="118" text-anchor="middle" font-size="10">(Backend Logic)</text>

    <!-- Server box -->
    <rect x="390" y="70" width="130" height="60" fill="#cce5ff" stroke="#333" stroke-width="2"/>
    <text x="455" y="105" text-anchor="middle" font-size="14">SERVER</text>

    <!-- Database box -->
    <rect x="560" y="70" width="130" height="60" fill="#ffe5cc" stroke="#333" stroke-width="2"/>
    <text x="625" y="105" text-anchor="middle" font-size="14">DATABASE</text>

    <!-- Arrows -->
    <line x1="140" y1="100" x2="200" y2="100" stroke="black" stroke-width="2"/>
    <line x1="330" y1="100" x2="390" y2="100" stroke="black" stroke-width="2"/>
    <line x1="520" y1="100" x2="560" y2="100" stroke="black" stroke-width="2"/>

  </svg>

  <p>Flow: Client sends a request → API receives and processes it → Server runs the logic → Database stores/retrieves data → Response travels back the same path to the Client.</p>

</body>
</html>
