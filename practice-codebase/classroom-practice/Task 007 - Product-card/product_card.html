<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Product Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <div class="image-section">
      <span class="discount-badge">20% OFF</span>
      <span class="wishlist-icon">&#9825;</span>
      <img src="c:\Users\kashi\OneDrive\Pictures\Saved Pictures\Shoes.jpeg" alt="Premium Running Shoes">
    </div>

    <div class="details-section">
      <span class="category">SPORTS SHOES</span>
      <h2 class="title">Premium Running Shoes</h2>

        <span class="stars">&#9733;&#9733;&#9733;&#9733;&#9733;</span>

  </div>

</body>
</html>
